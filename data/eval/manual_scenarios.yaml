# Manual eval contract:
# - expected_event_match_type: exact, alias, similar, unknown
# - expected_retrieval_mode: exact_only, exact_then_similar, similar_only, generic_fallback
# - expected_guardedness: low, medium, high
# - must_mention and must_not_do stay as explicit string lists for easy manual editing.

scenarios:
  # =====================
  # 1. Exact known event
  # =====================

  - id: exact_atlas_full_setup
    question: "Suggest a bikepacking setup for Atlas Mountain Race"
    group: exact_known_event
    why: "Tests exact event grounding and full setup generation"
    expected_event: "Atlas Mountain Race"
    expected_event_match_type: "exact"
    expected_intent: "full_setup"
    expected_component: "full_setup"
    expected_policy_mode: "strict_grounded"
    expected_retrieval_mode: "exact_then_similar"
    expected_guardedness: "low"
    must_mention:
      - "Atlas Mountain Race"
      - "setup"
    must_not_do:
      - "invent unsupported rider evidence"
      - "switch focus to bags"
    notes: ""

